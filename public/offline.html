<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#f6f2ec" />
<title>Harbor: you're offline</title>
<style>
  :root { color-scheme: light dark; --bg: #f6f2ec; --ink: rgba(38,28,22,.92); --ink-2: rgba(38,28,22,.64); --accent: #9c4f2e; --accent-ink: #fbf8f4; }
  @media (prefers-color-scheme: dark) { :root { --bg: #15110e; --ink: rgba(246,238,228,.94); --ink-2: rgba(246,238,228,.64); --accent: #c98a68; --accent-ink: #15110e; } }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { display: flex; align-items: center; justify-content: center; padding: 24px; background: var(--bg); color: var(--ink); font-family: system-ui, -apple-system, sans-serif; }
  main { max-width: 400px; }
  h1 { margin: 0 0 12px; font-family: Georgia, serif; font-weight: 500; font-size: 32px; line-height: 1.2; }
  p { margin: 0; color: var(--ink-2); line-height: 1.6; }
  .crisis { margin-top: 24px; color: var(--ink); }
  button { margin-top: 32px; min-height: 48px; padding: 0 24px; border: 0; border-radius: 12px; background: var(--accent); color: var(--accent-ink); font: 500 16px/1 system-ui, sans-serif; cursor: pointer; transition: transform 160ms cubic-bezier(.23,1,.32,1); }
  button:active { transform: scale(.97); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
  <main>
    <h1>You're offline.</h1>
    <p>Harbor needs one connection to finish setting up. After that, your tools work without signal.</p>
    <p class="crisis">If you're in crisis, call or text <strong>988</strong>. It works without the app.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
